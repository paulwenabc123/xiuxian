<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style></head><body>
<title>修仙傳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: full-width moonlit battlefield with game HUD overlaid; cultivator sheet, satchel and log below. Deliberate single dark look. */
:root{
  --night:#0b1019; --ink:#121927; --panel:#18202f; --line:#283246;
  --fg:#dde2ea; --muted:#8c97ab;
  --paper:#ecd79c; --cinnabar:#d8443a; --fire:#68e3ff; --jade:#7fd8a8;
  --display:"LXGW WenKai TC","Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
  --ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--night);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--fire);outline-offset:2px}
.app{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.scene{position:relative;height:clamp(380px,64vh,640px);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#05070c;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;inset:0;pointer-events:none;font-family:var(--display)}
.hud > *{position:absolute}
.hTL{left:12px;top:10px;display:flex;flex-direction:column;gap:4px;min-width:170px;max-width:45%}
.hName{font-size:20px;color:var(--paper);text-shadow:0 1px 4px #000;line-height:1.1}
.hName small{font-size:13px;color:var(--fg);margin-left:4px}
.hpbar{height:9px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);border-radius:5px;overflow:hidden}
.hpbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#c9333a,#ff7d6a)}
.expbar{height:4px;background:rgba(0,0,0,.6);border-radius:2px;overflow:hidden}
.expbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fb6d8,#a9f0ff)}
.hPow{font-family:var(--ui);font-size:12px;color:#c7cfdc;text-shadow:0 1px 3px #000}
.hPow b{color:var(--fire);font-size:15px}
.hTC{left:50%;top:10px;transform:translateX(-50%);text-align:center;width:min(300px,44%)}
.hZone{font-size:18px;color:#f1ede2;text-shadow:0 1px 4px #000;white-space:nowrap}
.prog{margin-top:4px;height:6px;background:rgba(0,0,0,.6);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--paper)}
.hProgTxt{font-family:var(--ui);font-size:11px;color:#c7cfdc;text-shadow:0 1px 3px #000;font-variant-numeric:tabular-nums}
.hTR{right:12px;top:10px;text-align:right;font-size:16px;color:#c7cfdc;text-shadow:0 1px 4px #000;font-variant-numeric:tabular-nums}
.hTR.mid{color:#ff6b5e}
.dlg{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;width:min(640px,calc(100% - 24px));background:linear-gradient(rgba(14,16,26,.95),rgba(8,10,16,.97));border:1px solid rgba(236,215,156,.55);border-radius:6px;padding:12px 16px 8px;cursor:pointer;z-index:6;box-shadow:0 6px 30px rgba(0,0,0,.6)}
.dlgName{font-family:var(--display);font-size:18px;margin-bottom:2px}
.dlgText{font-family:var(--display);font-size:17px;line-height:1.6;color:#eef0f4;min-height:3.2em}
.dlgHint{font-size:11px;color:var(--muted);text-align:right}
#dlgSkip{background:none;border:0;color:var(--paper);text-decoration:underline;font-size:11px;padding:0;margin-left:6px}
.chap{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:var(--display);font-size:44px;color:#f4e6bc;letter-spacing:.3em;text-shadow:0 0 24px rgba(0,0,0,.9),0 0 8px rgba(236,215,156,.5);pointer-events:none;z-index:5;animation:chapIn 3.2s ease forwards}
.chap small{display:block;font-size:18px;letter-spacing:.5em;color:#cfc2a0;margin-bottom:6px}
@keyframes chapIn{0%{opacity:0;transform:scale(1.08)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
@media (max-width:560px){.chap{font-size:30px}.dlgText{font-size:15px}}
.talbar{right:12px;top:40px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;pointer-events:auto}
.tchip{display:flex;align-items:center;gap:4px;background:linear-gradient(#f4e2a4,#d6bc6e);color:#8a1a14;border:0;border-radius:2px;padding:2px 7px;font-family:var(--display);font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.tchip b{font-family:var(--ui);font-size:11px;color:#3a1a10}
.buffs{right:62px;top:42px;font-family:var(--ui);font-size:11px;color:#ffe9a0;text-shadow:0 1px 2px #000;text-align:right;line-height:1.5}
.catH{margin:6px 0 0;font-family:var(--display);font-size:17px;color:var(--paper);font-weight:400;border-bottom:1px solid var(--line);padding-bottom:2px}
.pIcon.talI{border-radius:2px;width:34px;height:56px;background:linear-gradient(#f4e2a4,#d6bc6e);color:#b01e18;border:1px solid #a8862a;font-size:20px}
@media (max-width:560px){.talbar{top:auto;bottom:178px;flex-direction:row;flex-wrap:wrap;max-width:60%;justify-content:flex-end}.buffs{top:auto;bottom:210px;right:12px}}
.banner{left:50%;top:76px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(160,20,30,.85),transparent);color:#ffe9d6;font-size:15px;padding:3px 40px;letter-spacing:.14em;white-space:nowrap}
.bossbar{left:50%;bottom:16px;transform:translateX(-50%);width:min(440px,60%);text-align:center}
.bossbar span{font-size:15px;color:#ffb3a8;text-shadow:0 1px 4px #000}
.bossbar .hpbar{height:11px}
.bossbar .hpbar i{background:linear-gradient(90deg,#7b0f1a,#e2433b)}
.skills{right:12px;bottom:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:auto}
.skrow{display:flex;gap:8px;align-items:center}
.sk.sm{width:50px;height:50px;font-size:14px}
.sk.locked{filter:grayscale(1);opacity:.35}
.sk.notarget{opacity:.55;border-style:dashed}
.toast{left:50%;top:96px;transform:translateX(-50%);background:rgba(10,12,20,.9);border:1px solid rgba(236,215,156,.5);color:#f4e6bc;font-family:var(--ui);font-size:13px;padding:5px 14px;border-radius:4px;white-space:nowrap;z-index:7}
.sk{position:relative;width:62px;height:62px;border-radius:50%;border:2px solid rgba(236,215,156,.75);background:radial-gradient(circle at 50% 35%,#3a2e1a,#141018);color:var(--paper);font-family:var(--display);font-size:16px;line-height:1.05;overflow:hidden;box-shadow:0 0 14px rgba(0,0,0,.6)}
.sk.big{width:74px;height:74px;font-size:18px}
.sk .cd{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.sk .cdn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--ui);font-size:15px;color:#fff;pointer-events:none}
.autoBtn{width:50px;height:50px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(10,14,22,.8);font-family:var(--display);font-size:14px;color:#c7cfdc}
.autoBtn[aria-pressed="true"]{border-color:var(--fire);color:var(--fire);box-shadow:0 0 12px rgba(104,227,255,.35)}
.hint{left:12px;bottom:12px;font-family:var(--ui);font-size:11px;color:rgba(220,226,236,.55);text-shadow:0 1px 2px #000;max-width:40%}
.joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.05);pointer-events:none}
.joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(236,215,156,.45)}
@media (max-width:560px){.hTC{top:58px;width:70%}.banner{top:112px}.hTL{min-width:140px}.hName{font-size:17px}.sk{width:52px;height:52px;font-size:14px}.sk.big{width:62px;height:62px}.sk.sm{width:44px;height:44px;font-size:12px}.skrow{gap:6px}.hint{display:none}}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,.9fr);gap:14px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.logCard{grid-column:1/-1}}
@media (max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.heroRow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center}
#portrait{width:110px;height:125px;border-radius:6px;background:radial-gradient(circle at 60% 30%,#33456b,#0e1422 75%);border:1px solid var(--line)}
.heroInfo{display:flex;flex-direction:column;gap:10px;min-width:0}
.realmRow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.realm{font-family:var(--display);font-size:24px;color:var(--paper)}
.realm span{font-size:16px;color:var(--fg);margin-left:6px}
.power{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.power b{font-family:var(--display);font-size:20px;color:var(--fire);margin-left:4px}
.bar{height:8px;background:var(--ink);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3fb6d8,#a9f0ff);width:0}
.expTxt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.break{background:var(--cinnabar);color:#fff4e0;border:0;border-radius:4px;padding:8px;font-family:var(--display);font-size:17px;letter-spacing:.12em}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:0}
.stat{background:var(--ink);border-radius:4px;padding:6px 2px;text-align:center}
.stat dt{font-size:11px;color:var(--muted);letter-spacing:.1em}
.stat dd{margin:0;font-variant-numeric:tabular-nums;font-weight:500;font-size:13px}
.gear{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.slot{aspect-ratio:1;max-width:100%;background:var(--ink);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;position:relative}
.slot .g{font-family:var(--display);font-size:20px;line-height:1}
.slot .lv{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.slot.empty .g{color:var(--line)}
.slot.sel{outline:2px solid var(--fire);outline-offset:1px}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:6px 10px;white-space:nowrap;color:var(--muted);font-family:var(--display);font-size:16px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--paper)}
.bagHead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.bag{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
@media (max-width:420px){.bag{grid-template-columns:repeat(6,minmax(0,1fr))}.gear{grid-template-columns:repeat(3,minmax(0,1fr))}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.bag .slot .g{font-size:16px}
.detail{background:var(--ink);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-height:64px}
.detail h4{margin:0;font-family:var(--display);font-size:18px}
.detail .meta{font-size:12px;color:var(--muted)}
.detail ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;font-variant-numeric:tabular-nums}
.up{color:#7fd88a}.down{color:var(--cinnabar)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 12px}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.offer{background:transparent;border:1px solid var(--paper);color:var(--paper);border-radius:4px;padding:7px 12px;font-family:var(--display);font-size:15px}
.offer:disabled{opacity:.4}
.merRow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:var(--ink);border-radius:4px;padding:8px 10px}
.merRow h5{margin:0;font-family:var(--display);font-size:16px;font-weight:400}
.merRow p{margin:0;font-size:12px;color:var(--muted)}
.stones{font-variant-numeric:tabular-nums;color:var(--paper)}
.tabs{flex-wrap:wrap}
.signRow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.sd{background:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 2px;text-align:center;font-size:10.5px;color:var(--muted);line-height:1.35}
.sd b{display:block;font-family:var(--display);font-size:13px;color:var(--paper);font-weight:400}
.sd.done{opacity:.4}.sd.now{border-color:var(--paper);box-shadow:0 0 8px rgba(236,215,156,.3)}
.tRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--ink);border-radius:4px;padding:8px 10px}
.tRow b{font-weight:500}
.tbar{grid-column:1/-1;height:5px;background:#0a0e16;border-radius:3px;overflow:hidden}.tbar i{display:block;height:100%;background:var(--fire)}
.tut{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(440px,calc(100% - 32px));background:#141b2a;border:1px solid var(--paper);border-radius:8px;padding:12px 14px;z-index:20;box-shadow:0 10px 40px rgba(0,0,0,.7);display:flex;flex-direction:column;gap:8px;font-size:14px}
.tutStep{font-size:11px;color:var(--paper);letter-spacing:.1em}
.tutHL{outline:3px solid var(--fire)!important;outline-offset:3px;animation:hlp 1.2s ease-in-out infinite}
@keyframes hlp{50%{outline-color:rgba(104,227,255,.3)}}
select{background:var(--ink);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font:inherit}
.plist{display:flex;flex-direction:column;gap:8px}
.pRow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--ink);border-radius:6px;padding:8px 10px;border:1px solid transparent}
.pRow.active{border-color:rgba(236,215,156,.55)}
.pRow canvas{width:76px;height:76px;border-radius:6px;background:radial-gradient(circle at 50% 72%,#26324c,#111826)}
.pRow h5{margin:0;font-family:var(--display);font-size:17px;font-weight:400;color:var(--fg)}
.pRow h5 small{font-family:var(--ui);font-size:12px;color:var(--muted);margin-left:4px}
.pRow p{margin:0;font-size:12px;color:var(--muted)}
.pBtns{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.tagOn{font-size:12px;color:var(--paper);text-align:center;font-family:var(--display)}
.pIcon{width:52px;height:52px;border-radius:50%;border:2px solid rgba(236,215,156,.6);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:16px;color:var(--paper);background:radial-gradient(circle at 50% 35%,#3a2e1a,#141018);justify-self:center}
@media (max-width:440px){.pRow{grid-template-columns:60px minmax(0,1fr)}.pRow .pBtns,.pRow > .btn{grid-column:1/-1;flex-direction:row}.pRow canvas{width:60px;height:60px}}
.help{font-size:12px;color:var(--muted);margin:0}
.logCard h3{margin:0;font-family:var(--display);font-size:16px;color:var(--paper);font-weight:400}
.log{height:260px;overflow-y:auto;font-size:13px;display:flex;flex-direction:column;gap:2px}
.log p{margin:0;color:var(--muted)}
.log b{font-weight:500}
.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer}
.chk input{accent-color:var(--fire)}
.modal{position:fixed;inset:0;background:rgba(5,8,14,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{max-width:360px;width:100%;text-align:center}
.modal h3{margin:0;font-family:var(--display);font-size:22px;color:var(--paper)}

/* ===== mobile: full-screen battlefield + slide-up menu drawer ===== */
button,.sk,.tab,.btn{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.menuBtn,.drawHead,.drawBack{display:none}
body.mob{padding:0;overflow:hidden;overscroll-behavior:none;height:100dvh}
body.mob .app{max-width:none;gap:0}
body.mob .scene{position:fixed;inset:0;height:100dvh;border:0;border-radius:0}
body.mob .hTL{left:max(10px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 8px)}
body.mob .hTR{right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 8px);font-size:14px}
body.mob .hTC{top:calc(env(safe-area-inset-top,0px) + 8px)}
body.mob .talbar{right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 34px)}
body.mob .buffs{top:calc(env(safe-area-inset-top,0px) + 36px)}
body.mob .skills{right:max(10px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
body.mob .bossbar{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 100px)}
body.mob .dlg{bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
body.mob .hint{display:none}
body.mob .menuBtn{display:flex;position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);pointer-events:auto;flex-direction:column;align-items:center;justify-content:center;width:58px;height:58px;border-radius:14px;border:2px solid rgba(236,215,156,.7);background:rgba(16,14,22,.82);color:var(--paper);font-family:var(--display);font-size:13px;line-height:1.15;box-shadow:0 2px 12px rgba(0,0,0,.6)}
body.mob .menuBtn b{font-size:20px;font-weight:400}
body.mob .menuBtn .dot{position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--cinnabar);box-shadow:0 0 6px var(--cinnabar)}
body.mob .grid{position:fixed;left:0;right:0;bottom:0;height:min(74dvh,640px);z-index:15;display:flex;flex-direction:column;gap:10px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--night);border-top:1px solid rgba(236,215,156,.45);border-radius:16px 16px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.7);padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(12px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .28s ease;visibility:hidden}
body.mob.drawOpen .grid{transform:none;visibility:visible}
body.mob .grid{align-items:stretch}body.mob .drawHead{order:-2}body.mob .grid>.card:nth-of-type(3){order:-1}body.mob .gear{grid-template-columns:repeat(6,minmax(0,1fr))}body.mob .stats{grid-template-columns:repeat(5,minmax(0,1fr))}body.mob .heroRow{grid-template-columns:84px minmax(0,1fr)}body.mob #portrait{width:84px;height:96px}body.mob .realm{font-size:20px}
body.mob .drawHead{display:flex;position:sticky;top:0;z-index:2;align-items:center;justify-content:space-between;gap:8px;background:var(--night);padding:10px 2px 8px;margin:0 -2px;border-bottom:1px solid var(--line)}
body.mob .drawHead::before{content:"";position:absolute;left:50%;top:4px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
body.mob .drawHead h2{margin:0;font-family:var(--display);font-size:19px;font-weight:400;color:var(--paper)}
body.mob .drawHead .stones{font-size:13px}
body.mob .drawClose{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:20px;line-height:1}
body.mob .drawBack{display:block;position:fixed;inset:0;z-index:14;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .28s}
body.mob.drawOpen .drawBack{opacity:1;pointer-events:auto}
body.mob .card{padding:12px}
body.mob .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;position:sticky;top:59px;z-index:1;background:var(--panel);margin:-12px -12px 0;padding:4px 6px 0;border-radius:8px 8px 0 0}
body.mob .tabs::-webkit-scrollbar{display:none}
body.mob .tab{padding:9px 11px;font-size:16px}
body.mob .btn{padding:9px 14px;min-height:40px}
body.mob .offer{min-height:40px}
body.mob .log{height:180px}
body.mob .tut{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 90px);z-index:30}
body.mob .modal{z-index:31}
body.mob .toast{top:calc(env(safe-area-inset-top,0px) + 104px);white-space:normal;max-width:86vw;text-align:center}
/* portrait phone */
@media (orientation:portrait){
  body.mob .hTC{top:calc(env(safe-area-inset-top,0px) + 66px);width:62%}
  body.mob .banner{top:calc(env(safe-area-inset-top,0px) + 118px)}
  body.mob .talbar{top:calc(env(safe-area-inset-top,0px) + 34px);bottom:auto;flex-direction:column;max-width:none}
  body.mob .buffs{right:auto;left:max(10px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 70px);bottom:auto;text-align:left}
  body.mob .sk{width:56px;height:56px;font-size:14px}
  body.mob .sk.big{width:68px;height:68px;font-size:16px}
  body.mob .sk.sm{width:48px;height:48px;font-size:13px}
  body.mob .autoBtn{width:48px;height:48px}
  body.mob .skrow{gap:7px}
  body.mob .chap{font-size:30px;letter-spacing:.2em}
}
/* landscape phone: drawer becomes a right-side panel, HUD tighter */
@media (orientation:landscape){
  body.mob .grid{left:auto;top:0;height:100dvh;width:min(440px,58vw);border-radius:16px 0 0 16px;border-top:0;border-left:1px solid rgba(236,215,156,.45);transform:translateX(105%);padding-top:env(safe-area-inset-top,0px)}
  body.mob .drawHead::before{display:none}
  body.mob .hTL{min-width:150px}
  body.mob .hName{font-size:16px}
  body.mob .hTC{width:min(260px,36%)}
  body.mob .hZone{font-size:15px}
  body.mob .banner{top:calc(env(safe-area-inset-top,0px) + 62px);font-size:13px}
  body.mob .talbar{flex-direction:row;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);right:auto;left:calc(max(12px,env(safe-area-inset-left,0px)) + 70px);max-width:40%;flex-wrap:wrap;justify-content:flex-start}
  body.mob .buffs{top:calc(env(safe-area-inset-top,0px) + 34px)}
  body.mob .sk{width:50px;height:50px;font-size:13px}
  body.mob .sk.big{width:60px;height:60px;font-size:15px}
  body.mob .sk.sm{width:42px;height:42px;font-size:12px}
  body.mob .autoBtn{width:42px;height:42px;font-size:12px}
  body.mob .skills{gap:6px}
  body.mob .skrow{gap:6px}
  body.mob .dlg{width:min(560px,calc(100% - 300px));padding:8px 12px 6px}
  body.mob .dlgText{font-size:15px;min-height:2.6em}
  body.mob .chap{font-size:28px;top:30%}
  body.mob .bossbar{top:calc(env(safe-area-inset-top,0px) + 70px)}
}
.dTag{display:inline-block;margin-left:6px;padding:0 6px;border:1px solid;border-radius:3px;font-size:11px;line-height:16px;vertical-align:2px;background:rgba(0,0,0,.45)}
.diffRow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.diffBtn{background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 4px;font-family:var(--display);font-size:17px;min-height:44px}
.diffBtn[aria-pressed="true"]{border-color:currentColor;box-shadow:0 0 10px rgba(236,215,156,.25);background:#1d2536}
.sk.ult{border-color:#ff8a4a;background:radial-gradient(circle at 50% 35%,#5a2a14,#1a0c08);color:#ffd9a0;box-shadow:0 0 14px rgba(255,120,50,.45)}
</style>

 {n:'亂葬崗',sum:'師父下葬第七夜，墳地屍變。',pal:{d:[70,66,58],m:[50,66,48],k:[30,30,28]},props:{rock:3,tomb:9,tree:3,bones:3,flag:2,grass:6,lantern:1},

  try{switch(k){
  case'hit':nz(t0,.07,'bandpass',1800+Math.random()*600,.18,2);break;
  case'crit':nz(t0,.1,'bandpass',2600,.25,2);tone(t0,.18,'sine',1100,380,.12);break;
  case'slash':{const f=nz(t0,.2,'bandpass',800,.22,1.5);f.frequency.exponentialRampToValueAtTime(4000,t0+.18);break}
  case'thunder':nz(t0,.08,'highpass',3000,.5);nz(t0+.03,1.4,'lowpass',380,.7,.7);tone(t0,.6,'sawtooth',90,40,.12);break;
  case'fire':nz(t0,.7,'lowpass',900,.3);break;
  case'ice':tone(t0,.4,'sine',1760,2400,.08);tone(t0+.06,.35,'sine',2637,null,.05);nz(t0,.25,'highpass',5000,.08);break;
  case'coin':tone(t0,.12,'square',1320,null,.04);tone(t0+.07,.18,'square',1760,null,.04);break;
  case'level':[523,659,784,1047].forEach((f,i)=>tone(t0+i*.08,.35,'triangle',f,null,.12));break;

function renderTre(){const el=$('panelTre');el.innerHTML=stonesLine()+'<p class="help">靈寶一次只能祭出一件，戰鬥中會自動發動。</p>';
  TREASURES.forEach((T,i)=>{const own=S.trs[T.k],lv=own?own.lv:1,c=own?upCost(150+i*400,lv):T.cost,row=document.createElement('div');row.className='pRow'+(own&&S.tr===T.k?' active':'');
    row.innerHTML=`<canvas class="pv" data-t="${T.k}" width="152" height="152"></canvas><div><h5>${T.n} <small>${own?'Lv'+lv:'未擁有'}</small></h5><p>${T.d}</p><p>${own?'威力 +'+Math.round((trLv(T.k)-1)*100)+'%':''}</p></div>`;
    const b=document.createElement('div');b.className='pBtns';
    if(own){if(S.tr!==T.k)b.appendChild(mk('祭出',()=>{S.tr=T.k;treas.cd=1;log(`祭出靈寶 <b style="color:var(--paper)">${T.n}</b>`);renderTre()}));else b.insertAdjacentHTML('beforeend','<span class="tagOn">祭出中</span>');
      b.appendChild(mk(`祭煉 ${fmt(c)}`,()=>{if(S.stones<c)return;S.stones-=c;own.lv++;log(`${T.n} 祭煉至 Lv${own.lv}`);renderTre()},S.stones<c))}
    else b.appendChild(mk(`取得 ${fmt(c)}`,()=>{if(S.stones<c)return;S.stones-=c;S.trs[T.k]={lv:1};S.tr=T.k;treas.cd=1;log(`獲得靈寶 <b style="color:var(--paper)">${T.n}</b>！`);renderTre()},S.stones<c));
    row.appendChild(b);el.appendChild(row)})}
function renderTal(){const el=$('panelTal');el.innerHTML=stonesLine()+`<label class="chk"><input type="checkbox" id="autoTalChk" ${S.autoTal?'checked':''}> 氣血低於 30% 時自動用回血符</label>`;
  $('autoTalChk').onchange=e=>S.autoTal=e.target.checked;
  TALIS.forEach(T=>{const n=S.tal[T.k]||0,row=document.createElement('div');row.className='pRow';
    row.innerHTML=`<div class="pIcon talI">${T.g}</div><div><h5>${T.n} <small>持有 ${n}</small></h5><p>${T.d}</p></div>`;
    const b=document.createElement('div');b.className='pBtns';
    b.appendChild(mk(`買 1 張 ${fmt(T.cost)}`,()=>{if(S.stones<T.cost)return;S.stones-=T.cost;S.tal[T.k]=(S.tal[T.k]||0)+1;dirtyTal=true;renderTal()},S.stones<T.cost));
    b.appendChild(mk(`買 10 張 ${fmt(T.cost*9)}`,()=>{if(S.stones<T.cost*9)return;S.stones-=T.cost*9;S.tal[T.k]=(S.tal[T.k]||0)+10;dirtyTal=true;renderTal()},S.stones<T.cost*9));
    b.appendChild(mk('使用',()=>{useTal(T.k);renderTal()},!n));row.appendChild(b);el.appendChild(row)})}
let dirtyTal=true;
function renderTalbar(){const el=$('talbar');el.innerHTML='';TALIS.forEach(T=>{const n=S.tal[T.k]||0;if(!n)return;const b=document.createElement('button');b.type='button';b.className='tchip';b.title=`${T.n}：${T.d}`;b.innerHTML=`${T.g}<b>${n}</b>`;b.onclick=()=>useTal(T.k);el.appendChild(b)})}
function drawPreviews(){document.querySelectorAll('canvas.pv').forEach(c=>{if(!c.offsetParent)return;const g=c.getContext('2d');cx=g;g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,152,152);
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(76,136,40,8,0,0,7);g.fill();
  if(c.dataset.t){g.setTransform(2.4,0,0,2.4,76,76);drawTrIcon(c.dataset.t)}
  else if(c.dataset.e){const k=c.dataset.e,fe={kind:k,tint:c.dataset.c,ph:t,hop:t*6,mid:false,x:-9999,y:-9999,face:1,r:20,lunge:0,dead:false,born:1};if(k==='boss')g.setTransform(.58,0,0,.58,70,146);else g.setTransform(1.55,0,0,1.55,70,140);EDRAW[k](fe)}
  else if(c.dataset.m){g.setTransform(1.15,0,0,1.15,74,144);MOUNT_DRAW[c.dataset.m](t*10,true)}
  else{const k=c.dataset.p;const lv=S.pets[k]?S.pets[k].lv:1;if(k==='bird'||k==='dragon'){g.setTransform(1.6,0,0,1.6,k==='dragon'?80:84,k==='dragon'?165:150)}else g.setTransform(2.4,0,0,2.4,66,132);PET_DRAW[k](lv,t*12,true)}});cx=mainCx;lights=[]}
$('autoBtn').onclick=()=>{S.autoFight=!S.autoFight;log(S.autoFight?'開啟自動戰鬥':'關閉自動戰鬥，用搖桿或 WASD 移動')};
$('breakBtn').onclick=tryBreak;
$('farmBtn').onclick=()=>{if(S.farm){S.farm=false;S.stage=Math.min(S.stage+1,S.best);S.kills=0;log('整頓完畢，再闖前路。')}else{S.farm=true;log('停留此關刷怪。')}};
$('bunBtn').onclick=()=>{if(S.buns<1)return;S.buns--;gainItem(mkItem(pick(SLOTS).k,rollRarity(isMid()?2.4:1.4,0),Math.max(1,S.stage)),'拆開包子，得到 ')};
$('smeltBtn').onclick=()=>{let n=0,v=0;for(const it of[...S.bag])if(score(it)<=score(S.gear[it.slot])){v+=smelt(it.id,true);n++}log(n?`分解 ${n} 件，得靈石 <b class="stones">${fmt(v)}</b>`:'沒有比身上差的裝備')};
const aE=$('autoEquip');aE.checked=S.autoEquip;aE.onchange=()=>S.autoEquip=aE.checked;
const TABS=['Story','Bag','Mer','Skill','Talent','Mount','Pet','Tre','Tal','Sect','Daily','Dungeon','Shop','Ach','Book','Set'];
function tab(w){for(const k of TABS){$('tab'+k).setAttribute('aria-selected',k===w);$('panel'+k).hidden=k!==w}if(w==='Mer')renderMer();if(w==='Skill')renderSkills();if(w==='Mount')renderMounts();if(w==='Pet')renderPets();if(w==='Book')renderBook();if(w==='Daily')renderDaily();if(w==='Talent')renderTalent();if(w==='Sect')renderSect();if(w==='Dungeon')renderDungeon();if(w==='Shop')renderShop();if(w==='Ach')renderAch();if(w==='Set')renderSet();if(w==='Story')renderStory();if(w==='Tre')renderTre();if(w==='Tal')renderTal()}
TABS.forEach(k=>$('tab'+k).onclick=()=>tab(k));$('tutNext').onclick=()=>{tutI++;sfx('ui');showTut()};$('tutSkip').onclick=()=>{tutI=TUT.length;showTut()};
$('dlg').onclick=e=>{if(e.target.id!=='dlgSkip')nextDlg()};$('dlgSkip').onclick=e=>{e.stopPropagation();skipDlg()};
$('mOk').onclick=()=>$('modal').hidden=true;

/* offline */
if(!isNew){const sec=Math.min(8*3600,(Date.now()-S.last)/1000);if(sec>60){const kills=Math.floor(sec/1.5),s=S.stage;const ex=kills*3*Math.pow(1.12,s-1)*.4,st=kills*1.2*Math.pow(1.1,s-1)*.4,bn=Math.floor(sec/900);
  addExp(ex);S.stones+=st;S.buns+=bn;$('mBody').innerHTML=`離開 ${Math.floor(sec/3600)} 時 ${Math.floor(sec%3600/60)} 分，掛機斬鬼約 ${fmt(kills)} 隻。<br>修為 +${fmt(ex)}　靈石 +${fmt(st)}　包子 +${bn}`;$('modal').hidden=false}}
buildZone();ST=stats();P.hp=ST.hp;setTimeout(()=>startChapter(zoneIdx(S.stage)),600);
log('夜深了。鬼魂一到<b style="color:#ff8a7a">子時</b>就格外猖狂，掉的東西也特別多。');
if(isNew)log('飛劍會自動出鞘斬鬼。拖曳畫面或按 WASD 可親自走位，數字鍵 1–6 施放技能。');
log('你騎著<b style="color:var(--paper)">照夜白馬</b>，靈寵<b style="color:#8fd0ff">狐火</b>隨行。修為提升會陸續領悟定身符、三昧真火、金鐘罩、萬劍歸宗。');

let last=performance.now(),uiT=0,saveT=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!dlg)step(dt);else{dlgTick(dt);t+=dt}if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').hidden=true}if(chapT>0){chapT-=dt;if(chapT<=0)$('chap').hidden=true}draw();drawPortrait();uiT+=dt;saveT+=dt;if(uiT>.15){uiT=0;updateUI()}if(saveT>5){saveT=0;save()}requestAnimationFrame(frame)}
updateUI();requestAnimationFrame(frame);
addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
})();
</script>
</body></html>
